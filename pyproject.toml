[project]
name = "primitive_db"
version = "0.1.0"
description = "Консольная база данных с таблицами и CRUD-операциями"
authors = [{ name = "subwasser" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0,<4",
    "prompt>=0.4.1,<1",
]

[project.scripts]
database = "primitive_db.main:main"

[dependency-groups]
dev = ["ruff>=0.17.1,<0.18"]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.17.1,<0.18"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
